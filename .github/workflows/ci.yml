name: TerminalAI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Windows CI (PS 5.1 & PS 7)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Module Manifest (TerminalAI.psd1)
        shell: pwsh
        run: |
          Write-Host "=== Validating Module Manifest ===" -ForegroundColor Cyan
          $manifestPath = Join-Path $PWD "TerminalAI.psd1"
          $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          Write-Host "Module Name:    $($manifest.Name)"
          Write-Host "Module Version: $($manifest.Version)"
          Write-Host "Author:         $($manifest.Author)"
          Write-Host "Exported Funcs: $($manifest.ExportedFunctions.Count)"
          Write-Host "Exported Cmds:  $($manifest.ExportedCmdlets.Count)"
          Write-Host "Exported Alias: $($manifest.ExportedAliases.Count)"
          if ($manifest.Version -ne [version]"0.1.0") {
              throw "Expected ModuleVersion 0.1.0, got $($manifest.Version)"
          }
          Write-Host "Manifest is valid!" -ForegroundColor Green

      - name: Windows PowerShell 5.1 Syntax and Import Validation
        shell: powershell
        run: |
          Write-Host "=== Windows PowerShell 5.1 Syntax and Import Check ===" -ForegroundColor Cyan
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          
          # 1. Parse all PS scripts using AST parser
          $scripts = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1 | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          $parseFailures = 0
          foreach ($script in $scripts) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  Write-Host "Syntax Error in $($script.FullName):" -ForegroundColor Red
                  $errors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" -ForegroundColor Red }
                  $parseFailures++
              }
          }
          if ($parseFailures -gt 0) {
              throw "PowerShell 5.1 syntax check failed with $parseFailures file(s) containing errors."
          }
          Write-Host "All $($scripts.Count) scripts parsed cleanly in PS 5.1." -ForegroundColor Green

          # 2. Module Import Test in PS 5.1
          $global:Error.Clear()
          Import-Module .\TerminalAI.psd1 -Force -ErrorAction Stop
          $mod = Get-Module -Name TerminalAI
          if (-not $mod) { throw "TerminalAI module failed to import in PS 5.1" }
          if (-not $mod.ExportedFunctions.ContainsKey("Invoke-AiCommand")) { throw "Invoke-AiCommand not exported in PS 5.1" }
          if (-not $mod.ExportedAliases.ContainsKey("ai")) { throw "'ai' alias not exported in PS 5.1" }
          Write-Host "TerminalAI successfully imported in Windows PowerShell 5.1 ($($mod.ExportedFunctions.Count) functions, $($mod.ExportedAliases.Count) aliases)." -ForegroundColor Green

      - name: PowerShell 7 Syntax and Import Validation
        shell: pwsh
        run: |
          Write-Host "=== PowerShell 7 Syntax and Import Check ===" -ForegroundColor Cyan
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"

          # 1. Parse all PS scripts using AST parser
          $scripts = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1 | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          $parseFailures = 0
          foreach ($script in $scripts) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  Write-Host "Syntax Error in $($script.FullName):" -ForegroundColor Red
                  $errors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" -ForegroundColor Red }
                  $parseFailures++
              }
          }
          if ($parseFailures -gt 0) {
              throw "PowerShell 7 syntax check failed with $parseFailures file(s) containing errors."
          }
          Write-Host "All $($scripts.Count) scripts parsed cleanly in PS 7." -ForegroundColor Green

          # 2. Module Import Test in PS 7
          $global:Error.Clear()
          Import-Module .\TerminalAI.psd1 -Force -ErrorAction Stop
          $mod = Get-Module -Name TerminalAI
          if (-not $mod) { throw "TerminalAI module failed to import in PS 7" }
          if (-not $mod.ExportedFunctions.ContainsKey("Invoke-AiCommand")) { throw "Invoke-AiCommand not exported in PS 7" }
          if (-not $mod.ExportedAliases.ContainsKey("ai")) { throw "'ai' alias not exported in PS 7" }
          Write-Host "TerminalAI successfully imported in PowerShell 7 ($($mod.ExportedFunctions.Count) functions, $($mod.ExportedAliases.Count) aliases, $($mod.ExportedCmdlets.Count) cmdlets)." -ForegroundColor Green

      - name: PSScriptAnalyzer Recursive Check (0 Errors)
        shell: pwsh
        run: |
          Write-Host "=== Running PSScriptAnalyzer Quality Gate ===" -ForegroundColor Cyan
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $analysis = Invoke-ScriptAnalyzer -Path . -Recurse
          $errors = @($analysis | Where-Object { $_.Severity -eq 'Error' })
          $warnings = @($analysis | Where-Object { $_.Severity -eq 'Warning' })
          $info = @($analysis | Where-Object { $_.Severity -eq 'Information' })

          Write-Host "PSScriptAnalyzer Findings Summary:"
          Write-Host "  Errors:      $($errors.Count)" -ForegroundColor $(if ($errors.Count -eq 0) { "Green" } else { "Red" })
          Write-Host "  Warnings:    $($warnings.Count)" -ForegroundColor Yellow
          Write-Host "  Information: $($info.Count)" -ForegroundColor DarkGray

          if ($errors.Count -gt 0) {
              Write-Host "`nCRITICAL: PSScriptAnalyzer reported $($errors.Count) error(s):" -ForegroundColor Red
              $errors | Format-Table ScriptName, Line, RuleName, Message -AutoSize
              throw "PSScriptAnalyzer failed with $($errors.Count) error(s)."
          }
          Write-Host "PSScriptAnalyzer Error Gate passed (0 errors)." -ForegroundColor Green

      - name: Run Deterministic Core Test Suite (Test-TerminalAi.ps1)
        shell: pwsh
        env:
          TERMINAL_AI_CONFIG_DIR: ${{ runner.temp }}/tai_ci_config
        run: |
          Write-Host "=== Running Deterministic Test-TerminalAi.ps1 ===" -ForegroundColor Cyan
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\Test-TerminalAi.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Test-TerminalAi.ps1 exited with code $LASTEXITCODE"
          }

      - name: Run Deterministic P0 Security Gate Tests
        shell: pwsh
        env:
          TERMINAL_AI_CONFIG_DIR: ${{ runner.temp }}/tai_ci_config
        run: |
          Write-Host "=== Running P0-SecurityGate.Tests.ps1 ===" -ForegroundColor Cyan
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\P0-SecurityGate.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "P0-SecurityGate.Tests.ps1 exited with code $LASTEXITCODE"
          }

      - name: Run Deterministic P1 UX & Assistant Tests
        shell: pwsh
        env:
          TERMINAL_AI_CONFIG_DIR: ${{ runner.temp }}/tai_ci_config
        run: |
          Write-Host "=== Running P1-UxAssistant.Tests.ps1 ===" -ForegroundColor Cyan
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\P1-UxAssistant.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "P1-UxAssistant.Tests.ps1 exited with code $LASTEXITCODE"
          }

      - name: Run Deterministic P2 Multi-User Stability Tests
        shell: pwsh
        env:
          TERMINAL_AI_CONFIG_DIR: ${{ runner.temp }}/tai_ci_config
        run: |
          Write-Host "=== Running P2-MultiUserStability.Tests.ps1 ===" -ForegroundColor Cyan
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\P2-MultiUserStability.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "P2-MultiUserStability.Tests.ps1 exited with code $LASTEXITCODE"
          }

      - name: Run Deterministic P3 Agent Mode Tests
        shell: pwsh
        env:
          TERMINAL_AI_CONFIG_DIR: ${{ runner.temp }}/tai_ci_config
        run: |
          Write-Host "=== Running P3-AgentMode.Tests.ps1 ===" -ForegroundColor Cyan
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\P3-AgentMode.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "P3-AgentMode.Tests.ps1 exited with code $LASTEXITCODE"
          }

      - name: Run Deterministic P4 Packaging & Distribution Tests
        shell: pwsh
        env:
          TERMINAL_AI_CONFIG_DIR: ${{ runner.temp }}/tai_ci_config
        run: |
          Write-Host "=== Running P4-Packaging.Tests.ps1 ===" -ForegroundColor Cyan
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\P4-Packaging.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "P4-Packaging.Tests.ps1 exited with code $LASTEXITCODE"
          }

      - name: Package Content & Zero Dev Leaks Audit
        shell: pwsh
        run: |
          Write-Host "=== Staging and Auditing Package Content for Zero Dev Leaks ===" -ForegroundColor Cyan
          $stagingDir = Join-Path $env:RUNNER_TEMP "GalleryStagingAudit"
          & .\tools\Publish-TerminalAiGallery.ps1 -StagingPath $stagingDir -DryRun -Force
          
          $stagedFiles = Get-ChildItem -Path $stagingDir -Recurse -File
          Write-Host "Staged $($stagedFiles.Count) files in package:"
          $stagedFiles | ForEach-Object { Write-Host "  • $($_.Name) ($($_.Length) bytes)" }

          # Strict leak checks
          $devLeaked = @($stagedFiles | Where-Object {
              $_.Name -like "*.Tests.ps1" -or
              $_.Name -like "*.cs" -or
              $_.Name -like "*.csproj" -or
              $_.Name -like "*.sln" -or
              $_.Name -like "*.git*" -or
              $_.FullName -match "tests|tools|Launcher|AOT|\.codegraph"
          })
          if ($devLeaked.Count -gt 0) {
              Write-Host "Dev files leaked into production package:" -ForegroundColor Red
              $devLeaked | ForEach-Object { Write-Host "  ✖ $($_.FullName)" -ForegroundColor Red }
              throw "Package purity audit failed: $($devLeaked.Count) dev file(s) found in staging."
          }
          Write-Host "Package Content Audit passed: Zero dev leaks detected." -ForegroundColor Green
